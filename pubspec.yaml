name: calculadora_metodo
description: Calculadora de Métodos Numéricos - Análisis Numérico
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  math_expressions: ^2.4.0
  fl_chart: ^0.66.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo_bg.png"
  min_sdk_android: 21
  adaptive_icon_background: "#00184A"
  adaptive_icon_foreground: "assets/logo_bg.png"

flutter_native_splash:
  color: "#00184A"
  image: assets/logo_bg.png
  android: true
  ios: false
  android_12:
    color: "#00184A"
    image: assets/logo_bg.png
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_bg.png
