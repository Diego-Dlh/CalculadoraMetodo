name: calculadora_metodo
description: Calculadora del Método de Bisección - Análisis Numérico
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Parseo y evaluación de expresiones matemáticas
  math_expressions: ^2.4.0

  # Gráficos interactivos
  fl_chart: ^0.66.2

  # Gestión de estado
  provider: ^6.1.2

  # Fuentes tipográficas de Google
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
